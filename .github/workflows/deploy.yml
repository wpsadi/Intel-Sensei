name: Deploy Website to Development Environment

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "vite.config.*"
      - "tsconfig*.json"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "vite.config.*"
      - "tsconfig*.json"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Vite outputs to `dist/`
      - name: Build project
        run: npm run build

      - name: Deploy to Cloudflare Pages
        id: deploy
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH_NAME="pr-${{ github.event.pull_request.number }}"
          else
            BRANCH_NAME="main"
          fi

          echo "Deploying Pages branch: $BRANCH_NAME"

          npx wrangler pages deploy dist \
            --project-name=intel-sensei \
            --branch "$BRANCH_NAME"

          if [ "$BRANCH_NAME" = "main" ]; then
            PREVIEW_URL="https://intel-sensei.pages.dev"
          else
            PREVIEW_URL="https://${BRANCH_NAME}.intel-sensei.pages.dev"
          fi

          echo "preview_url=$PREVIEW_URL" >> $GITHUB_OUTPUT
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment deployment URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Preview deployed**:\n${{ steps.deploy.outputs.preview_url }}`
            })
